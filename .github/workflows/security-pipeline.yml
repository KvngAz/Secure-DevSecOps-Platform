name: DevSecOps Security Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest

    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run Semgrep
        run: semgrep scan --config auto

  sca:
    name: SCA - Trivy Filesystem Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Scan dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  container-scan:
    name: Container Scan
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - auth-service
          - user-service
          - product-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build ${{ matrix.service }} image
        run: docker build -t secure-devsecops-${{ matrix.service }}:ci ./services/${{ matrix.service }}

      - name: Scan ${{ matrix.service }} image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: secure-devsecops-${{ matrix.service }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  sbom:
    name: SBOM Generation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          path: .

  publish-sign:
    name: Publish and Sign Images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        service:
          - auth-service
          - user-service
          - product-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.0.0

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ./services/${{ matrix.service }}
          push: true
          tags: docker.io/${{ vars.DOCKERHUB_USERNAME }}/secure-devsecops-${{ matrix.service }}:${{ github.sha }}

      - name: Sign image
        env:
          IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/secure-devsecops-${{ matrix.service }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Verify image signature
        env:
          IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/secure-devsecops-${{ matrix.service }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity="https://github.com/KvngAz/Secure-DevSecOps-Platform/.github/workflows/security-pipeline.yml@refs/heads/main" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com"
