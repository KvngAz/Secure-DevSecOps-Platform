name: DevSecOps Security Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest

    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run Semgrep
        run: semgrep scan --config auto

  sca:
    name: SCA - Trivy Filesystem Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Scan dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  container-scan:
   container-scan:
    name: Container Scan
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - auth-service
          - user-service
          - product-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build ${{ matrix.service }} image
        run: docker build -t secure-devsecops-${{ matrix.service }}:ci ./services/${{ matrix.service }}

      - name: Scan ${{ matrix.service }} image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: secure-devsecops-${{ matrix.service }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true