name: DevSecOps Security Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest

    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run Semgrep
        run: semgrep scan --config auto

  sca:
    name: SCA - Trivy Filesystem Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Scan dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  container-scan:
    name: Container Scan
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - auth-service
          - user-service
          - product-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build ${{ matrix.service }} image
        run: docker build -t secure-devsecops-${{ matrix.service }}:ci ./services/${{ matrix.service }}

      - name: Scan ${{ matrix.service }} image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: secure-devsecops-${{ matrix.service }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  sbom:
    name: SBOM Generation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          path: .

  dast:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest
    needs:
      - sast
      - sca
      - container-scan
      - sbom

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Start application
        run: docker compose up -d --build

      - name: Wait for services
        run: |
          sleep 10
          curl --fail http://127.0.0.1:5001/
          curl --fail http://127.0.0.1:5002/users/1
          curl --fail http://127.0.0.1:5003/products

      - name: Run ZAP baseline scan - auth-service
        run: |
          docker run --network host \
            -v "${{ github.workspace }}:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:5001/ \
            -r zap-auth-report.html || true

      - name: Run ZAP baseline scan - user-service
        run: |
          docker run --network host \
            -v "${{ github.workspace }}:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:5002/users/1 \
            -r zap-user-report.html || true

      - name: Run ZAP baseline scan - product-service
        run: |
          docker run --network host \
            -v "${{ github.workspace }}:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:5003/products \
            -r zap-product-report.html || true

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-reports
          path: |
            zap-auth-report.html
            zap-user-report.html
            zap-product-report.html

      - name: Stop application
        if: always()
        run: docker compose down

  telegram-report:
    name: Send Telegram Security Report
    if: always()
    runs-on: ubuntu-latest
    needs:
      - sast
      - sca
      - container-scan
      - sbom
      - publish-sign
      - dast

    steps:
      - name: Download ZAP reports
        uses: actions/download-artifact@v4
        with:
          name: zap-dast-reports
          path: zap-reports
        continue-on-error: true

      - name: Send security summary to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SAST_RESULT: ${{ needs.sast.result }}
          SCA_RESULT: ${{ needs.sca.result }}
          CONTAINER_RESULT: ${{ needs.container-scan.result }}
          SBOM_RESULT: ${{ needs.sbom.result }}
          SIGN_RESULT: ${{ needs.publish-sign.result }}
          DAST_RESULT: ${{ needs.dast.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MESSAGE="🔐 DevSecOps Security Report

          Repository: ${{ github.repository }}
          Workflow: DevSecOps Security Pipeline
          Run: #${{ github.run_number }}

          SAST - Semgrep: ${SAST_RESULT}
          SCA - Trivy: ${SCA_RESULT}
          Container Scan: ${CONTAINER_RESULT}
          SBOM Generation: ${SBOM_RESULT}
          Image Signing: ${SIGN_RESULT}
          DAST - OWASP ZAP: ${DAST_RESULT}

          ZAP reports are attached to this workflow run.

          View workflow:
          ${RUN_URL}"

          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"

      - name: Send ZAP auth report
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -f zap-reports/zap-auth-report.html ]; then
            curl -sS -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "document=@zap-reports/zap-auth-report.html"
          fi

      - name: Send ZAP user report
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -f zap-reports/zap-user-report.html ]; then
            curl -sS -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "document=@zap-reports/zap-user-report.html"
          fi
          
      - name: Send ZAP product report
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -f zap-reports/zap-product-report.html ]; then
            curl -sS -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "document=@zap-reports/zap-product-report.html"
          fi

  publish-sign:
    name: Publish and Sign Images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        service:
          - auth-service
          - user-service
          - product-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.0.0

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ./services/${{ matrix.service }}
          push: true
          tags: docker.io/${{ vars.DOCKERHUB_USERNAME }}/secure-devsecops-${{ matrix.service }}:${{ github.sha }}

      - name: Sign image
        env:
          IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/secure-devsecops-${{ matrix.service }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Wait for signature to become available
        run: sleep 15

      - name: Verify image signature
        env:
          IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/secure-devsecops-${{ matrix.service }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity="https://github.com/KvngAz/Secure-DevSecOps-Platform/.github/workflows/security-pipeline.yml@refs/heads/main" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com"
